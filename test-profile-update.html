<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料修改测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 5px; padding: 10px; }
        input { margin: 5px; padding: 5px; width: 200px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🔧 个人资料修改测试</h1>
    
    <div class="test-section">
        <h2>1. 模拟用户登录状态</h2>
        <button onclick="simulateLogin()">模拟登录</button>
        <button onclick="clearAuth()">清除认证</button>
        <div id="authStatus" class="info">未登录</div>
    </div>

    <div class="test-section">
        <h2>2. 个人资料修改</h2>
        <input type="text" id="nickname" placeholder="昵称" value="测试用户">
        <input type="email" id="email" placeholder="邮箱" value="test@example.com">
        <br>
        <button onclick="updateProfile()">更新个人资料</button>
        <div id="updateResult"></div>
    </div>

    <div class="test-section">
        <h2>3. 验证保存状态</h2>
        <button onclick="checkProfile()">检查当前资料</button>
        <button onclick="simulateLogout()">模拟登出</button>
        <button onclick="simulateRelogin()">模拟重新登录</button>
        <div id="profileResult"></div>
    </div>

    <div class="test-section">
        <h2>4. Supabase连接测试</h2>
        <button onclick="testSupabaseConnection()">测试Supabase连接</button>
        <div id="supabaseResult"></div>
    </div>

    <div id="logs" class="log"></div>

    <script>
        let logs = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            logs.push(logMessage);
            
            const logDiv = document.getElementById('logs');
            logDiv.innerHTML = logs.slice(-10).join('\n');
            
            console.log(logMessage);
        }

        // 模拟登录状态
        function simulateLogin() {
            const mockUser = {
                id: '6882df3f2f9efaa6e241dce5',
                nickname: '测试用户',
                email: 'test@example.com',
                avatar: 'https://files.authing.co/authing-console/default-user-avatar.png'
            };
            
            const mockToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ODgyZGYzZjJmOWVmYWE2ZTI0MWRjZTUiLCJuYW1lIjoi5rWL6K-V55So5oi3IiwiaWF0IjoxNTE2MjM5MDIyLCJleHAiOjk5OTk5OTk5OTl9.test';
            
            localStorage.setItem('auth_token', mockToken);
            localStorage.setItem('authing_user', JSON.stringify(mockUser));
            
            document.getElementById('authStatus').innerHTML = `<span class="success">已登录: ${mockUser.nickname}</span>`;
            log('模拟登录成功', 'success');
        }

        // 清除认证
        function clearAuth() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('authing_user');
            sessionStorage.clear();
            
            document.getElementById('authStatus').innerHTML = '<span class="error">未登录</span>';
            log('认证已清除', 'info');
        }

        // 更新个人资料
        async function updateProfile() {
            const nickname = document.getElementById('nickname').value;
            const email = document.getElementById('email').value;
            
            if (!localStorage.getItem('auth_token')) {
                document.getElementById('updateResult').innerHTML = '<span class="error">请先登录</span>';
                return;
            }

            try {
                log(`开始更新个人资料: ${nickname}, ${email}`);
                
                // 测试Netlify Function (生产环境)
                const response = await fetch('https://www.wenpai.xyz/.netlify/functions/update-user-profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
                    },
                    body: JSON.stringify({
                        nickname: nickname,
                        email: email
                    })
                });

                const result = await response.json();
                log(`Netlify Function响应: ${JSON.stringify(result)}`);

                if (response.ok && result.success) {
                    // 更新本地存储
                    const currentUser = JSON.parse(localStorage.getItem('authing_user') || '{}');
                    currentUser.nickname = nickname;
                    currentUser.email = email;
                    localStorage.setItem('authing_user', JSON.stringify(currentUser));
                    
                    document.getElementById('updateResult').innerHTML = '<span class="success">更新成功</span>';
                    log('个人资料更新成功', 'success');
                } else {
                    document.getElementById('updateResult').innerHTML = `<span class="error">更新失败: ${result.error || '未知错误'}</span>`;
                    log(`更新失败: ${result.error || '未知错误'}`, 'error');
                }
            } catch (error) {
                document.getElementById('updateResult').innerHTML = `<span class="error">网络错误: ${error.message}</span>`;
                log(`网络错误: ${error.message}`, 'error');
            }
        }

        // 检查当前资料
        function checkProfile() {
            const user = localStorage.getItem('authing_user');
            if (user) {
                const userData = JSON.parse(user);
                document.getElementById('profileResult').innerHTML = `
                    <div class="info">
                        <strong>当前资料:</strong><br>
                        昵称: ${userData.nickname || '未设置'}<br>
                        邮箱: ${userData.email || '未设置'}<br>
                        ID: ${userData.id || '未设置'}
                    </div>
                `;
                log(`当前资料: ${JSON.stringify(userData)}`);
            } else {
                document.getElementById('profileResult').innerHTML = '<span class="error">未找到用户资料</span>';
                log('未找到用户资料', 'error');
            }
        }

        // 模拟登出
        function simulateLogout() {
            clearAuth();
            document.getElementById('profileResult').innerHTML = '<span class="info">已登出</span>';
            log('模拟登出完成');
        }

        // 模拟重新登录
        function simulateRelogin() {
            // 模拟从服务器重新获取用户信息
            simulateLogin();
            
            // 检查资料是否保持
            setTimeout(() => {
                checkProfile();
                log('重新登录后检查资料');
            }, 500);
        }

        // 测试Supabase连接
        async function testSupabaseConnection() {
            const userId = '6882df3f2f9efaa6e241dce5';
            const supabaseUrl = 'https://weizkydylskcwgnaieqy.supabase.co';
            
            try {
                log('测试Supabase连接...');
                
                // 测试用户订阅查询
                const subscriptionUrl = `${supabaseUrl}/rest/v1/user_subscriptions?select=*&user_id=eq.${userId}&status=eq.active&order=created_at.desc&limit=1`;
                
                const response = await fetch(subscriptionUrl, {
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                log(`Supabase响应状态: ${response.status}`);
                
                if (response.status === 406) {
                    document.getElementById('supabaseResult').innerHTML = '<span class="error">Supabase返回406错误 - 可能是API密钥或权限问题</span>';
                    log('Supabase 406错误 - API密钥或权限问题', 'error');
                } else if (response.ok) {
                    const data = await response.json();
                    document.getElementById('supabaseResult').innerHTML = `<span class="success">Supabase连接成功: ${JSON.stringify(data)}</span>`;
                    log(`Supabase连接成功: ${JSON.stringify(data)}`, 'success');
                } else {
                    document.getElementById('supabaseResult').innerHTML = `<span class="error">Supabase错误: ${response.status}</span>`;
                    log(`Supabase错误: ${response.status}`, 'error');
                }
            } catch (error) {
                document.getElementById('supabaseResult').innerHTML = `<span class="error">连接失败: ${error.message}</span>`;
                log(`Supabase连接失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时检查状态
        window.onload = function() {
            if (localStorage.getItem('auth_token')) {
                checkProfile();
            }
            log('页面加载完成');
        };
    </script>
</body>
</html>
