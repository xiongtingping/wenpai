<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 统一Emoji系统测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            color: white;
            text-align: center;
        }
        .test-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .test-button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        .test-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .emoji-item {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid #ddd;
        }
        .emoji-item:hover {
            transform: scale(1.2);
        }
        .result-display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #007bff;
        }
        .category-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .category-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .category-card h4 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .category-card .count {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎨 统一Emoji系统测试</h1>
        <p>测试500个emoji的统一管理系统</p>
    </div>

    <div class="stats">
        <h3>📊 系统概览</h3>
        <p>统一管理 <strong>500</strong> 个emoji，分为 <strong>5</strong> 大类别</p>
        <p>支持搜索、分类、随机选择、SVG生成等功能</p>
    </div>

    <!-- 基础功能测试 -->
    <div class="test-section">
        <h3>🔧 基础功能测试</h3>
        <button class="test-button" onclick="testGetAllEmojis()">获取所有Emoji</button>
        <button class="test-button" onclick="testGetCategories()">获取分类信息</button>
        <button class="test-button" onclick="testRandomEmojis()">随机选择Emoji</button>
        <button class="test-button" onclick="testSearchEmojis()">搜索功能</button>
        <div id="basicTestResult" class="result-display" style="display: none;"></div>
    </div>

    <!-- 分类测试 -->
    <div class="test-section">
        <h3>📂 分类功能测试</h3>
        <button class="test-button" onclick="testCategoryEmojis('animals')">动物类</button>
        <button class="test-button" onclick="testCategoryEmojis('food')">食物类</button>
        <button class="test-button" onclick="testCategoryEmojis('objects')">物品类</button>
        <button class="test-button" onclick="testCategoryEmojis('emotions')">表情类</button>
        <button class="test-button" onclick="testCategoryEmojis('nature')">自然类</button>
        <div id="categoryTestResult" class="result-display" style="display: none;"></div>
    </div>

    <!-- SVG生成测试 -->
    <div class="test-section">
        <h3>🎨 SVG生成测试</h3>
        <button class="test-button" onclick="testSVGGeneration()">生成SVG头像</button>
        <div id="svgTestResult" class="result-display" style="display: none;"></div>
    </div>

    <!-- 统计信息 -->
    <div class="test-section">
        <h3>📈 统计信息</h3>
        <button class="test-button" onclick="showStats()">显示统计</button>
        <div id="statsResult" class="category-stats" style="display: none;"></div>
    </div>

    <script>
        // 模拟统一emoji系统的数据结构
        const mockEmojiData = {
            animals: Array.from({length: 100}, (_, i) => ({
                id: `animal_${String(i+1).padStart(3, '0')}`,
                name: `动物${i+1}`,
                emoji: ['🐱', '🐶', '🐻', '🐰', '🦊', '🐼', '🐵', '🐯', '🦁', '🐮'][i % 10],
                color: ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7'][i % 5],
                category: 'animals',
                keywords: ['动物', '可爱'],
                source: 'system'
            })),
            food: Array.from({length: 100}, (_, i) => ({
                id: `food_${String(i+1).padStart(3, '0')}`,
                name: `食物${i+1}`,
                emoji: ['🍎', '🍌', '🍊', '🍓', '🍇', '🍉', '🍑', '🍍', '🥭', '🍋'][i % 10],
                color: ['#FF6B6B', '#FDCB6E', '#FD79A8', '#E84393', '#6C5CE7'][i % 5],
                category: 'food',
                keywords: ['食物', '美味'],
                source: 'system'
            })),
            objects: Array.from({length: 100}, (_, i) => ({
                id: `object_${String(i+1).padStart(3, '0')}`,
                name: `物品${i+1}`,
                emoji: ['🚗', '✈️', '🚂', '🚲', '🏍️', '⛵', '🚀', '📱', '💻', '📷'][i % 10],
                color: ['#0984E3', '#74B9FF', '#636E72', '#00B894', '#E17055'][i % 5],
                category: 'objects',
                keywords: ['物品', '工具'],
                source: 'system'
            })),
            emotions: Array.from({length: 100}, (_, i) => ({
                id: `emotion_${String(i+1).padStart(3, '0')}`,
                name: `表情${i+1}`,
                emoji: ['😊', '😂', '😍', '😘', '😉', '🤔', '😮', '😳', '😴', '😠'][i % 10],
                color: ['#FDCB6E', '#FFEAA7', '#FD79A8', '#E84393', '#74B9FF'][i % 5],
                category: 'emotions',
                keywords: ['表情', '情感'],
                source: 'system'
            })),
            nature: Array.from({length: 100}, (_, i) => ({
                id: `nature_${String(i+1).padStart(3, '0')}`,
                name: `自然${i+1}`,
                emoji: ['☀️', '🌙', '⭐', '🌈', '⚡', '❄️', '🔥', '💧', '☁️', '🌪️'][i % 10],
                color: ['#FDCB6E', '#74B9FF', '#FFEAA7', '#FD79A8', '#E17055'][i % 5],
                category: 'nature',
                keywords: ['自然', '天气'],
                source: 'system'
            }))
        };

        const allEmojis = Object.values(mockEmojiData).flat();

        function testGetAllEmojis() {
            const result = document.getElementById('basicTestResult');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>✅ 获取所有Emoji测试</h4>
                <p>总数量: <strong>${allEmojis.length}</strong> 个emoji</p>
                <p>前10个emoji预览:</p>
                <div class="emoji-grid">
                    ${allEmojis.slice(0, 10).map(emoji => 
                        `<div class="emoji-item" style="background-color: ${emoji.color}" title="${emoji.name}">${emoji.emoji}</div>`
                    ).join('')}
                </div>
            `;
        }

        function testGetCategories() {
            const categories = Object.keys(mockEmojiData);
            const result = document.getElementById('basicTestResult');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>✅ 获取分类信息测试</h4>
                <p>分类数量: <strong>${categories.length}</strong> 个</p>
                <p>分类列表: ${categories.map(cat => `<span style="background: #e9ecef; padding: 2px 8px; border-radius: 12px; margin: 2px;">${cat}</span>`).join(' ')}</p>
            `;
        }

        function testRandomEmojis() {
            const randomEmojis = [];
            for (let i = 0; i < 5; i++) {
                const randomIndex = Math.floor(Math.random() * allEmojis.length);
                randomEmojis.push(allEmojis[randomIndex]);
            }
            
            const result = document.getElementById('basicTestResult');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>✅ 随机选择Emoji测试</h4>
                <p>随机选择了 <strong>5</strong> 个emoji:</p>
                <div class="emoji-grid">
                    ${randomEmojis.map(emoji => 
                        `<div class="emoji-item" style="background-color: ${emoji.color}" title="${emoji.name} (${emoji.category})">${emoji.emoji}</div>`
                    ).join('')}
                </div>
            `;
        }

        function testSearchEmojis() {
            const searchTerm = '动物';
            const searchResults = allEmojis.filter(emoji => 
                emoji.name.includes(searchTerm) || emoji.keywords.some(keyword => keyword.includes(searchTerm))
            );
            
            const result = document.getElementById('basicTestResult');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>✅ 搜索功能测试</h4>
                <p>搜索关键词: "<strong>${searchTerm}</strong>"</p>
                <p>找到 <strong>${searchResults.length}</strong> 个相关emoji</p>
                <div class="emoji-grid">
                    ${searchResults.slice(0, 20).map(emoji => 
                        `<div class="emoji-item" style="background-color: ${emoji.color}" title="${emoji.name}">${emoji.emoji}</div>`
                    ).join('')}
                </div>
            `;
        }

        function testCategoryEmojis(category) {
            const categoryEmojis = mockEmojiData[category] || [];
            const result = document.getElementById('categoryTestResult');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>✅ ${category} 类别测试</h4>
                <p>该类别包含 <strong>${categoryEmojis.length}</strong> 个emoji</p>
                <p>前20个emoji预览:</p>
                <div class="emoji-grid">
                    ${categoryEmojis.slice(0, 20).map(emoji => 
                        `<div class="emoji-item" style="background-color: ${emoji.color}" title="${emoji.name}">${emoji.emoji}</div>`
                    ).join('')}
                </div>
            `;
        }

        function testSVGGeneration() {
            const randomEmoji = allEmojis[Math.floor(Math.random() * allEmojis.length)];
            
            // 模拟SVG生成
            const svg = `
                <svg width="100" height="100" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="100" fill="${randomEmoji.color}" />
                    <text x="100" y="130" font-size="80" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">${randomEmoji.emoji}</text>
                </svg>
            `;
            
            const result = document.getElementById('svgTestResult');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>✅ SVG生成测试</h4>
                <p>为 "<strong>${randomEmoji.name}</strong>" 生成SVG头像:</p>
                <div style="display: flex; align-items: center; gap: 20px; margin: 15px 0;">
                    <div>${svg}</div>
                    <div>
                        <p><strong>名称:</strong> ${randomEmoji.name}</p>
                        <p><strong>Emoji:</strong> ${randomEmoji.emoji}</p>
                        <p><strong>颜色:</strong> ${randomEmoji.color}</p>
                        <p><strong>类别:</strong> ${randomEmoji.category}</p>
                    </div>
                </div>
            `;
        }

        function showStats() {
            const stats = {
                total: allEmojis.length,
                byCategory: {},
                bySource: {}
            };
            
            allEmojis.forEach(emoji => {
                stats.byCategory[emoji.category] = (stats.byCategory[emoji.category] || 0) + 1;
                stats.bySource[emoji.source] = (stats.bySource[emoji.source] || 0) + 1;
            });
            
            const result = document.getElementById('statsResult');
            result.style.display = 'grid';
            result.innerHTML = `
                <div class="category-card">
                    <h4>总计</h4>
                    <div class="count">${stats.total}</div>
                </div>
                ${Object.entries(stats.byCategory).map(([category, count]) => `
                    <div class="category-card">
                        <h4>${category}</h4>
                        <div class="count">${count}</div>
                    </div>
                `).join('')}
            `;
        }

        // 页面加载完成后显示欢迎信息
        window.addEventListener('load', () => {
            console.log('🎨 统一Emoji系统测试页面已加载');
            console.log('📊 模拟数据统计:', {
                总数量: allEmojis.length,
                分类数量: Object.keys(mockEmojiData).length,
                各分类数量: Object.fromEntries(Object.entries(mockEmojiData).map(([k, v]) => [k, v.length]))
            });
        });
    </script>
</body>
</html>
