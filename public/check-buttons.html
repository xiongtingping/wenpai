<!DOCTYPE html>
<html>
<head>
    <title>按钮对齐检查</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>按钮对齐检查工具</h1>
    <button onclick="checkButtons()">检查首页按钮对齐</button>
    <button onclick="openHomePage()">打开首页</button>
    <div id="results"></div>

    <script>
        function checkButtons() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">正在检查...</div>';
            
            // 打开首页
            const homeWindow = window.open('/', '_blank');
            
            setTimeout(() => {
                try {
                    const homeDoc = homeWindow.document;
                    const results = [];
                    
                    // 检查定价区域按钮
                    const pricingButtons = homeDoc.querySelectorAll('#pricing button');
                    results.push(`找到定价区域按钮: ${pricingButtons.length} 个`);
                    
                    pricingButtons.forEach((btn, index) => {
                        const rect = btn.getBoundingClientRect();
                        const parent = btn.parentElement;
                        const parentRect = parent.getBoundingClientRect();
                        
                        const btnCenter = rect.left + rect.width / 2;
                        const parentCenter = parentRect.left + parentRect.width / 2;
                        const offset = Math.abs(btnCenter - parentCenter);
                        
                        results.push(`按钮 ${index + 1}: 偏移 ${offset.toFixed(1)}px ${offset < 10 ? '✅' : '❌'}`);
                    });
                    
                    // 显示结果
                    resultsDiv.innerHTML = results.map(r => 
                        `<div class="result ${r.includes('✅') ? 'success' : r.includes('❌') ? 'error' : ''}">${r}</div>`
                    ).join('');
                    
                } catch (error) {
                    resultsDiv.innerHTML = `<div class="result error">检查失败: ${error.message}</div>`;
                }
            }, 2000);
        }
        
        function openHomePage() {
            window.open('/', '_blank');
        }
    </script>
</body>
</html>
