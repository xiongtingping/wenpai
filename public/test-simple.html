<!DOCTYPE html>
<html>
<head>
    <title>简单测试页</title>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; padding: 2rem;">
    <h1 style="color: green;">✅ 服务器运行正常！</h1>
    <p>当前时间：<span id="time"></span></p>
    <p>如果你能看到这个页面，说明Vite服务器工作正常。</p>
    
    <div style="margin: 2rem 0; padding: 1rem; background: #f0f8ff; border-radius: 8px;">
        <h3>测试结果：</h3>
        <p id="status">JavaScript正在加载...</p>
        <button onclick="testFunction()">点击测试</button>
    </div>
    
    <script>
        function updateTime() {
            document.getElementById('time').textContent = new Date().toLocaleString();
        }
        
        function testFunction() {
            alert('✅ JavaScript运行正常！');
            document.getElementById('status').textContent = '✅ 所有功能正常工作！';
            document.getElementById('status').style.color = 'green';
        }
        
        // 立即更新状态
        document.getElementById('status').textContent = '✅ JavaScript加载成功！';
        document.getElementById('status').style.color = 'green';
        updateTime();
        setInterval(updateTime, 1000);
        
        console.log('✅ 测试页面JavaScript执行成功');
    </script>
</body>
</html>
