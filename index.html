<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🔧 强制清理缓存，解决 authing-fix.js 缓存问题 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WenPai AI - Intelligent Content Creation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/ikigai_4circles_multiply.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🔧 ES模块导入映射 - 重定向React导入到CDN -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://unpkg.com/react@18/index.js",
        "react-dom": "https://unpkg.com/react-dom@18/index.js", 
        "react-dom/client": "https://unpkg.com/react-dom@18/client.js",
        "react/jsx-runtime": "data:text/javascript,export const jsx = window.React.createElement; export const jsxs = window.React.createElement; export const Fragment = window.React.Fragment;"
      }
    }
    </script>
    
    <!-- 🔧 终极解决方案：预加载真正的React库和jsx-runtime -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/react@18/cjs/react-jsx-runtime.production.min.js"></script>
    
    <!-- 🔧 关键修复：jsx-runtime全局映射增强版 -->
    <script>
      // jsx-runtime 外部化全面支持
      if (typeof window.React !== 'undefined') {
        // 创建jsx-runtime全局模块
        const jsxRuntime = {
          jsx: React.createElement,
          jsxs: React.createElement, 
          Fragment: React.Fragment,
          // 备用导出
          default: {
            jsx: React.createElement,
            jsxs: React.createElement,
            Fragment: React.Fragment
          }
        };
        
        // 多种方式设置全局变量
        window['react/jsx-runtime'] = jsxRuntime;
        window.ReactJSXRuntime = jsxRuntime;
        
        // 模块系统支持
        if (typeof window.System !== 'undefined') {
          window.System.set('react/jsx-runtime', jsxRuntime);
        }
        
        // AMD支持
        if (typeof window.define === 'function' && window.define.amd) {
          window.define('react/jsx-runtime', [], () => jsxRuntime);
        }
        
        // CommonJS支持
        if (typeof module !== 'undefined' && module.exports) {
          const originalModule = window.module;
          window.module = {
            ...originalModule,
            exports: {
              ...originalModule?.exports,
              'react/jsx-runtime': jsxRuntime
            }
          };
        }
        
        console.log('🔧 jsx-runtime全局变量和模块支持已完整设置');
      }
    </script>
    
    <!-- 🔧 React验证和保护机制 -->
    <script>
      (function() {
        'use strict';
        console.log('🔧 Real React loaded, setting up protection');
        
        // 确保React和ReactDOM全局可用
        if (typeof window.React !== 'undefined' && typeof window.ReactDOM !== 'undefined') {
          console.log('✅ Real React and ReactDOM available');
          
          // 添加保护机制，确保React不会被意外覆盖
          const originalReact = window.React;
          const originalReactDOM = window.ReactDOM;
          
          // 锁定React对象
          Object.defineProperty(window, 'React', {
            get: function() { return originalReact; },
            set: function(value) { 
              console.log('🛡️ Prevented React override, keeping original');
              return originalReact; 
            },
            configurable: false
          });
          
          Object.defineProperty(window, 'ReactDOM', {
            get: function() { return originalReactDOM; },
            set: function(value) { 
              console.log('🛡️ Prevented ReactDOM override, keeping original');
              return originalReactDOM; 
            },
            configurable: false
          });
          
          // 多重引用确保兼容性
          window.react = originalReact;
          window.__REACT__ = originalReact;
          
          // 🔧 模块系统映射 - 确保vendor文件能找到React
          if (typeof define === 'function' && define.amd) {
            // AMD模块系统
            define('react', function() { return originalReact; });
            define('react-dom', function() { return originalReactDOM; });
          }
          
          // CommonJS模块系统
          if (typeof module !== 'undefined' && module.exports) {
            const originalExports = module.exports;
            Object.defineProperty(window, 'module', {
              get: function() { 
                return {
                  exports: {
                    ...originalExports,
                    React: originalReact,
                    'react': originalReact,
                    'react-dom': originalReactDOM
                  }
                };
              }
            });
          }
          
          // ES6模块系统映射
          if (typeof window.System !== 'undefined') {
            window.System.set('react', window.System.newModule({ default: originalReact }));
            window.System.set('react-dom', window.System.newModule({ default: originalReactDOM }));
          }
          
          // 🔧 动态模块拦截 - 处理import语句
          const originalImport = window.import || function() {};
          window.import = function(specifier) {
            if (specifier === 'react') {
              console.log('🛡️ Intercepted React import, returning global React');
              return Promise.resolve({ 
                default: originalReact,
                ...originalReact 
              });
            }
            if (specifier === 'react-dom') {
              console.log('🛡️ Intercepted ReactDOM import, returning global ReactDOM');
              return Promise.resolve({ 
                default: originalReactDOM,
                ...originalReactDOM 
              });
            }
            return originalImport.call(this, specifier);
          };
          
        } else {
          console.error('🚨 Failed to load real React, using fallback');
          // 回退到简单的模拟对象
          window.React = {
            forwardRef: function(render) { return render || function() { return null; }; },
            createContext: function(defaultValue) {
              return {
                Provider: function(props) { return props.children; },
                Consumer: function(props) { return props.children(defaultValue); }
              };
            }
          };
        }
        
        // 错误拦截机制保持不变
        window.addEventListener('error', function(event) {
          const message = event.message || '';
          const filename = event.filename || '';
          
          console.log('🚨 Error intercepted:', {
            message: message,
            filename: filename,
            prevented: filename.includes('vendor')
          });
          
          // 只静默vendor错误，让应用正常错误显示
          if (filename.includes('vendor') && 
              (message.includes('forwardRef') || message.includes('createContext'))) {
            console.log('🛡️ Vendor React error silenced');
            event.preventDefault();
            return false;
          }
        }, true);
        
        console.log('✅ React protection and error handling ready');
        
        // 🔧 强制应用启动 - 确保即使vendor错误也能渲染基本内容
        setTimeout(function() {
          console.log('🔧 Checking if app started...');
          const root = document.getElementById('root');
          // 检查是否有实际的React应用内容（而不是loading状态）
          const hasRealContent = root && root.innerHTML && 
                                 root.innerHTML.trim() !== '' && 
                                 !root.innerHTML.includes('正在加载') &&
                                 !root.innerHTML.includes('Loading');
          
          if (!hasRealContent) {
            console.log('🚨 App not started, forcing basic render');
            
            // 🔧 直接替换root内容，确保可见
            root.innerHTML = '';
            root.style.cssText = 'display: block !important; visibility: visible !important; opacity: 1 !important; position: relative !important; z-index: 9999 !important;';
            
            // 立即显示基础内容
            const loadingDiv = document.createElement('div');
            loadingDiv.style.cssText = 'padding: 40px 20px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: white; min-height: 100vh; color: #333;';
            loadingDiv.innerHTML = '<h1 style="color: #2563eb; margin-bottom: 20px;">文派AI</h1><p style="font-size: 18px; margin-bottom: 10px;">正在启动应用程序...</p><p style="color: #666; font-size: 14px;">如果此消息持续显示，请刷新页面</p>';
            root.appendChild(loadingDiv);
            
            // 尝试手动触发应用启动
            setTimeout(function() {
              if (window.React && window.ReactDOM && window.ReactDOM.createRoot) {
                try {
                  console.log('🔧 Attempting manual app startup');
                  
                  // 清空并重新设置root
                  root.innerHTML = '';
                  root.style.cssText = 'display: block !important; visibility: visible !important; opacity: 1 !important;';
                  
                  // 创建简单但可见的React应用
                  const App = window.React.createElement('div', {
                    style: { 
                      padding: '40px 20px', 
                      textAlign: 'center', 
                      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                      background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                      color: 'white',
                      minHeight: '100vh',
                      display: 'flex',
                      flexDirection: 'column',
                      justifyContent: 'center',
                      alignItems: 'center'
                    }
                  }, 
                    window.React.createElement('h1', { 
                      style: { fontSize: '2.5rem', marginBottom: '1rem', fontWeight: 'bold' }
                    }, '🚀 WenPai AI'),
                    window.React.createElement('p', { 
                      style: { fontSize: '1.2rem', marginBottom: '2rem', opacity: 0.9 }
                    }, 'AI驱动的智能内容创作平台'),
                    window.React.createElement('div', {
                      style: {
                        background: 'rgba(255,255,255,0.1)',
                        padding: '20px',
                        borderRadius: '10px',
                        backdropFilter: 'blur(10px)'
                      }
                    }, 
                      window.React.createElement('p', { style: { margin: 0 } }, '应用已成功启动！')
                    )
                  );
                  
                  const reactRoot = window.ReactDOM.createRoot(root);
                  reactRoot.render(App);
                  console.log('✅ Manual React app started');
                } catch (error) {
                  console.error('🚨 Manual startup failed:', error);
                  // 如果React启动失败，显示纯HTML内容
                  root.innerHTML = '<div style="padding: 40px 20px; text-align: center; font-family: Arial, sans-serif; background: #f0f9ff; min-height: 100vh;"><h1 style="color: #1e40af;">文派AI</h1><p>系统正在初始化，请稍候...</p><button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新页面</button></div>';
                }
              } else {
                // 如果React不可用，显示纯HTML内容
                root.innerHTML = '<div style="padding: 40px 20px; text-align: center; font-family: Arial, sans-serif; background: #fef3c7; min-height: 100vh;"><h1 style="color: #92400e;">文派AI</h1><p>正在加载必要资源...</p><button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #d97706; color: white; border: none; border-radius: 5px; cursor: pointer;">重新加载</button></div>';
              }
            }, 1000);
          } else {
            console.log('✅ App appears to be running normally');
          }
        }, 3000); // 降低检测时间，加快响应
        
        // 🔥 终极fallback - 如果1秒后还没有main.tsx执行，立即启动基本React应用
        setTimeout(function() {
          if (!window.__MAIN_TSX_LOADED__) {
            console.log('🔥 main.tsx未加载，启动HTML内联React应用...');
            
            const root = document.getElementById('root');
            if (root && window.React && window.ReactDOM) {
              try {
                // 创建完整的WenPai AI应用界面
                const App = window.React.createElement('div', {
                  style: { 
                    minHeight: '100vh',
                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    color: 'white',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
                  }
                }, 
                  // Header
                  window.React.createElement('header', {
                    style: { 
                      padding: '20px',
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center',
                      background: 'rgba(255,255,255,0.1)',
                      backdropFilter: 'blur(10px)'
                    }
                  },
                    window.React.createElement('h1', { 
                      style: { fontSize: '1.5rem', fontWeight: 'bold', margin: 0 }
                    }, '🚀 WenPai AI'),
                    window.React.createElement('button', {
                      style: {
                        background: 'rgba(255,255,255,0.2)',
                        border: 'none',
                        borderRadius: '8px',
                        padding: '8px 16px',
                        color: 'white',
                        cursor: 'pointer'
                      },
                      onClick: () => location.reload()
                    }, '刷新页面')
                  ),
                  
                  // Main content
                  window.React.createElement('main', {
                    style: { 
                      flex: 1,
                      display: 'flex',
                      flexDirection: 'column',
                      justifyContent: 'center',
                      alignItems: 'center',
                      padding: '40px 20px',
                      textAlign: 'center'
                    }
                  },
                    window.React.createElement('h2', { 
                      style: { fontSize: '3rem', marginBottom: '1rem', fontWeight: 'bold' }
                    }, 'WenPai AI'),
                    window.React.createElement('p', { 
                      style: { fontSize: '1.5rem', marginBottom: '2rem', opacity: 0.9 }
                    }, 'AI驱动的智能内容创作平台'),
                    window.React.createElement('div', {
                      style: {
                        background: 'rgba(255,255,255,0.1)',
                        padding: '30px',
                        borderRadius: '15px',
                        backdropFilter: 'blur(10px)',
                        maxWidth: '600px'
                      }
                    }, 
                      window.React.createElement('p', { 
                        style: { margin: '0 0 20px 0', fontSize: '1.1rem' } 
                      }, '应用正在加载中...'),
                      window.React.createElement('p', { 
                        style: { margin: '0', fontSize: '0.9rem', opacity: 0.8 } 
                      }, '如果长时间未响应，请刷新页面重试')
                    )
                  )
                );
                
                // 清空并渲染
                root.innerHTML = '';
                root.style.cssText = 'display: block !important; visibility: visible !important; opacity: 1 !important;';
                
                const reactRoot = window.ReactDOM.createRoot(root);
                reactRoot.render(App);
                console.log('✅ HTML内联React应用启动成功');
                
              } catch (error) {
                console.error('🚨 HTML内联React启动失败:', error);
              }
            }
          }
        }, 1000);
        
      })();
    </script>
    
    <!-- 🔍 JS加载检测和fallback -->
    <script>
      console.log('🔍 HTML: 准备加载主应用JS文件...');
      
      // 检测JS加载错误
      window.addEventListener('error', function(event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          console.error('🚨 JS文件加载失败:', event.target.src, event);
          // 如果主JS加载失败，立即显示基本界面
          const root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="padding: 40px 20px; text-align: center; font-family: Arial, sans-serif; background: #fee2e2; min-height: 100vh;"><h1 style="color: #dc2626;">文派AI</h1><p>主程序加载失败，请刷新页面重试</p><button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新页面</button></div>';
          }
        }
      });
      
      // 2秒后检查主应用是否启动
      setTimeout(function() {
        console.log('🔍 HTML: 2秒检查 - 是否看到main.tsx日志...');
      }, 2000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🎯 独立的Dialog Portal容器 - 不受#root样式影响 -->
    <div id="dialog-portal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
