<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🔧 强制清理缓存，解决 authing-fix.js 缓存问题 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WenPai AI - Intelligent Content Creation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/ikigai_4circles_multiply.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🔧 终极解决方案：预加载真正的React库 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 🔧 React验证和保护机制 -->
    <script>
      (function() {
        'use strict';
        console.log('🔧 Real React loaded, setting up protection');
        
        // 确保React和ReactDOM全局可用
        if (typeof window.React !== 'undefined' && typeof window.ReactDOM !== 'undefined') {
          console.log('✅ Real React and ReactDOM available');
          
          // 添加保护机制，确保React不会被意外覆盖
          const originalReact = window.React;
          const originalReactDOM = window.ReactDOM;
          
          // 锁定React对象
          Object.defineProperty(window, 'React', {
            get: function() { return originalReact; },
            set: function(value) { 
              console.log('🛡️ Prevented React override, keeping original');
              return originalReact; 
            },
            configurable: false
          });
          
          Object.defineProperty(window, 'ReactDOM', {
            get: function() { return originalReactDOM; },
            set: function(value) { 
              console.log('🛡️ Prevented ReactDOM override, keeping original');
              return originalReactDOM; 
            },
            configurable: false
          });
          
          // 多重引用确保兼容性
          window.react = originalReact;
          window.__REACT__ = originalReact;
          
          // 🔧 模块系统映射 - 确保vendor文件能找到React
          if (typeof define === 'function' && define.amd) {
            // AMD模块系统
            define('react', function() { return originalReact; });
            define('react-dom', function() { return originalReactDOM; });
          }
          
          // CommonJS模块系统
          if (typeof module !== 'undefined' && module.exports) {
            const originalExports = module.exports;
            Object.defineProperty(window, 'module', {
              get: function() { 
                return {
                  exports: {
                    ...originalExports,
                    React: originalReact,
                    'react': originalReact,
                    'react-dom': originalReactDOM
                  }
                };
              }
            });
          }
          
          // ES6模块系统映射
          if (typeof window.System !== 'undefined') {
            window.System.set('react', window.System.newModule({ default: originalReact }));
            window.System.set('react-dom', window.System.newModule({ default: originalReactDOM }));
          }
          
          // 🔧 动态模块拦截 - 处理import语句
          const originalImport = window.import || function() {};
          window.import = function(specifier) {
            if (specifier === 'react') {
              console.log('🛡️ Intercepted React import, returning global React');
              return Promise.resolve({ 
                default: originalReact,
                ...originalReact 
              });
            }
            if (specifier === 'react-dom') {
              console.log('🛡️ Intercepted ReactDOM import, returning global ReactDOM');
              return Promise.resolve({ 
                default: originalReactDOM,
                ...originalReactDOM 
              });
            }
            return originalImport.call(this, specifier);
          };
          
        } else {
          console.error('🚨 Failed to load real React, using fallback');
          // 回退到简单的模拟对象
          window.React = {
            forwardRef: function(render) { return render || function() { return null; }; },
            createContext: function(defaultValue) {
              return {
                Provider: function(props) { return props.children; },
                Consumer: function(props) { return props.children(defaultValue); }
              };
            }
          };
        }
        
        // 错误拦截机制保持不变
        window.addEventListener('error', function(event) {
          const message = event.message || '';
          const filename = event.filename || '';
          
          console.log('🚨 Error intercepted:', {
            message: message,
            filename: filename,
            prevented: filename.includes('vendor')
          });
          
          // 只静默vendor错误，让应用正常错误显示
          if (filename.includes('vendor') && 
              (message.includes('forwardRef') || message.includes('createContext'))) {
            console.log('🛡️ Vendor React error silenced');
            event.preventDefault();
            return false;
          }
        }, true);
        
        console.log('✅ React protection and error handling ready');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🎯 独立的Dialog Portal容器 - 不受#root样式影响 -->
    <div id="dialog-portal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
