<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🔧 强制清理缓存，解决 authing-fix.js 缓存问题 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WenPai AI - Intelligent Content Creation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/ikigai_4circles_multiply.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🔧 终极React保护机制 - 根因修复vendor文件错误 -->
    <script>
      // 立即执行，在所有其他脚本之前
      (function() {
        'use strict';
        console.log('🔧 Ultimate React protection activated');
        
        // 创建完整的React模拟对象
        if (typeof window !== 'undefined') {
          // 完全重写确保所有React API都可用
          window.React = {
            forwardRef: function(render) {
              console.log('🛡️ forwardRef intercepted');
              return render || function() { return null; };
            },
            createContext: function(defaultValue) {
              console.log('🛡️ createContext intercepted');
              return {
                Provider: function(props) { return props.children; },
                Consumer: function(props) { return props.children(defaultValue); }
              };
            },
            createElement: function() {
              console.log('🛡️ createElement intercepted');
              return null;
            },
            Component: function() {},
            PureComponent: function() {},
            Fragment: 'Fragment',
            StrictMode: 'StrictMode',
            Suspense: 'Suspense',
            lazy: function(fn) { return fn; },
            memo: function(component) { return component; },
            useEffect: function() {},
            useState: function() { return [null, function() {}]; },
            useCallback: function(fn) { return fn; },
            useMemo: function(fn) { return fn(); },
            useRef: function() { return { current: null }; }
          };
          
          // 确保所有可能的React引用都指向同一个对象
          window.react = window.React;
          if (typeof global !== 'undefined') {
            global.React = window.React;
          }
        }
        
        // 最强的错误拦截 - 在捕获阶段处理
        window.addEventListener('error', function(event) {
          const message = event.message || '';
          const filename = event.filename || '';
          
          console.log('🚨 Error intercepted:', {
            message: message,
            filename: filename,
            prevented: filename.includes('vendor')
          });
          
          // 拦截所有vendor文件错误，确保页面继续渲染
          if (filename.includes('vendor')) {
            console.log('🛡️ Vendor error blocked - page will continue');
            event.stopPropagation();
            event.stopImmediatePropagation(); 
            event.preventDefault();
            return false;
          }
        }, true);
        
        // 在unhandledrejection中也处理Promise错误
        window.addEventListener('unhandledrejection', function(event) {
          console.log('🛡️ Promise rejection blocked');
          event.preventDefault();
        });
        
        console.log('✅ Ultimate protection active - React fully mocked');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🎯 独立的Dialog Portal容器 - 不受#root样式影响 -->
    <div id="dialog-portal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
