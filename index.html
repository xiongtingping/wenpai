<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🔧 强制清理缓存，解决 authing-fix.js 缓存问题 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WenPai AI - Intelligent Content Creation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/ikigai_4circles_multiply.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🔧 超强React保护机制 - 多层防护确保页面正常渲染 -->
    <script>
      // 🔧 第一层：全局对象锁定，确保React对象永远存在
      (function() {
        'use strict';
        console.log('🔧 Super React protection activated');
        
        // 创建不可变的React模拟对象
        const ReactMock = {
          forwardRef: function(render) {
            console.log('🛡️ forwardRef safely handled');
            return render || function() { return null; };
          },
          createContext: function(defaultValue) {
            console.log('🛡️ createContext safely handled');
            return {
              Provider: function(props) { return props.children; },
              Consumer: function(props) { return props.children(defaultValue); }
            };
          },
          createElement: function() { return null; },
          Component: function() {},
          PureComponent: function() {},
          Fragment: 'Fragment',
          StrictMode: 'StrictMode',
          Suspense: 'Suspense',
          lazy: function(fn) { return fn; },
          memo: function(component) { return component; },
          useEffect: function() {},
          useState: function() { return [null, function() {}]; },
          useCallback: function(fn) { return fn; },
          useMemo: function(fn) { return fn(); },
          useRef: function() { return { current: null }; }
        };
        
        // 🔧 强制注入到所有可能的位置
        if (typeof window !== 'undefined') {
          // 使用Object.defineProperty确保无法被覆盖
          Object.defineProperty(window, 'React', {
            value: ReactMock,
            writable: false,
            configurable: false
          });
          
          // 多重保险
          window.react = ReactMock;
          window.__REACT__ = ReactMock;
          
          if (typeof global !== 'undefined') {
            global.React = ReactMock;
          }
          
          // 🔧 提前注入模块系统
          if (typeof module !== 'undefined' && module.exports) {
            module.exports.React = ReactMock;
          }
        }
        
        // 🔧 第二层：动态属性拦截
        const originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          // 拦截对React的重新定义
          if (prop === 'React' && obj === window) {
            console.log('🛡️ Prevented React override attempt');
            return obj;
          }
          return originalDefineProperty.call(this, obj, prop, descriptor);
        };
        
        // 🔧 第三层：最强错误拦截
        window.addEventListener('error', function(event) {
          const message = event.message || '';
          const filename = event.filename || '';
          
          console.log('🚨 Error intercepted:', {
            message: message,
            filename: filename,
            prevented: filename.includes('vendor')
          });
          
          // 强制阻止vendor错误
          if (filename.includes('vendor')) {
            console.log('🛡️ Vendor error completely blocked');
            event.stopPropagation();
            event.stopImmediatePropagation(); 
            event.preventDefault();
            return false;
          }
        }, true);
        
        // Promise错误处理
        window.addEventListener('unhandledrejection', function(event) {
          console.log('🛡️ Promise rejection handled');
          event.preventDefault();
        });
        
        console.log('✅ Super protection active - React locked and secured');
      })();
    </script>
    
    <!-- 🔧 Pre-vendor验证脚本 - 确保React在任何vendor代码执行前都可用 -->
    <script>
      // 在任何模块加载前进行最后检查
      console.log('🔧 Pre-vendor React validation');
      
      // 验证React对象是否正确配置
      if (typeof window.React === 'undefined' || !window.React.forwardRef) {
        console.error('🚨 React protection failed, emergency fix');
        window.React = {
          forwardRef: function(r) { return r || function(){return null;}; },
          createContext: function(d) { return {Provider:function(p){return p.children;},Consumer:function(p){return p.children(d);}}; }
        };
      }
      
      console.log('✅ React verified before vendor loading:', !!window.React?.forwardRef);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🎯 独立的Dialog Portal容器 - 不受#root样式影响 -->
    <div id="dialog-portal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
