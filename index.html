<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🔧 强制清理缓存，解决 authing-fix.js 缓存问题 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WenPai AI - Intelligent Content Creation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/ikigai_4circles_multiply.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>

    <!-- 🔧 修复 - 移除技术债务式的错误拦截，已修复根本问题 -->
    <script>
      // 🎯 轻量级错误处理，仅处理第三方库的非关键错误
      (function() {
        // 最小化的错误处理，专门针对第三方库的已知问题
        const thirdPartyErrorPatterns = [
          'cloudflare-static',
          'X-Frame-Options',
          'chromewebdata',
          'Cannot read properties of undefined (reading \'push\')'  // Guard库的已知问题
        ];

        const isThirdPartyError = (message) => {
          return thirdPartyErrorPatterns.some(pattern => message && message.includes(pattern));
        };

        // 仅处理第三方库的静默错误
        window.addEventListener('error', function(event) {
          const errorMessage = event.message || (event.error && event.error.message) || '';
          const sourcePath = (event && event.target && event.target.src) || '';
          
          // 仅静默处理第三方库错误，让应用代码错误正常显示
          if (isThirdPartyError(errorMessage) || isThirdPartyError(sourcePath)) {
            console.log('🔇 静默处理第三方错误:', errorMessage || sourcePath);
            event.preventDefault();
            return false;
          }
        }, true);

        // 仅处理第三方库的Promise错误
        window.addEventListener('unhandledrejection', function(event) {
          const reason = typeof event.reason === 'string' ? event.reason : 
                        event.reason && event.reason.message ? event.reason.message : '';
          
          if (isThirdPartyError(reason)) {
            console.log('🔇 静默处理第三方Promise错误:', reason);
            event.preventDefault();
            return false;
          }
        });

        console.log('✅ 轻量级错误处理已激活 - 根本问题已修复');
      })();
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
