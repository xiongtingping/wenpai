<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🔧 强制清理缓存，解决 authing-fix.js 缓存问题 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WenPai AI - Intelligent Content Creation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/ikigai_4circles_multiply.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🔧 诊断并修复React加载问题 -->
    <script>
      (function() {
        'use strict';
        console.log('🔧 Diagnostic mode activated');
        
        // 在页面加载前确保React对象存在
        if (typeof window !== 'undefined') {
          window.React = window.React || {};
          // 提供基本的React方法确保vendor文件不会崩溃
          if (!window.React.forwardRef) {
            window.React.forwardRef = function(render) {
              return render || function() { return null; };
            };
          }
          if (!window.React.createContext) {
            window.React.createContext = function(defaultValue) {
              return {
                Provider: function(props) { return props.children; },
                Consumer: function(props) { return props.children(defaultValue); }
              };
            };
          }
        }
        
        // 详细的错误处理和日志
        window.addEventListener('error', function(event) {
          console.log('🚨 Error detected:', {
            message: event.message,
            filename: event.filename,
            lineno: event.lineno,
            colno: event.colno
          });
          
          // 只静默vendor文件的React相关错误
          if (event.filename && event.filename.includes('vendor') && 
              (event.message.includes('forwardRef') || event.message.includes('createContext'))) {
            console.log('🛡️ Vendor React error silenced');
            event.preventDefault();
            return false;
          }
        }, true);
        
        console.log('✅ Diagnostic setup complete');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🎯 独立的Dialog Portal容器 - 不受#root样式影响 -->
    <div id="dialog-portal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
