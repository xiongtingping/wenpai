<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🔧 强制清理缓存，解决 authing-fix.js 缓存问题 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>WenPai AI - Intelligent Content Creation Platform</title>
    <link rel="icon" type="image/svg+xml" href="/ikigai_4circles_multiply.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🔧 根因修复：简洁有效的forwardRef保护 -->
    <script>
      (function() {
        'use strict';
        console.log('🔧 Clean forwardRef protection activated');
        
        // 静默处理vendor文件中的forwardRef错误，不干预React运行时
        window.addEventListener('error', function(event) {
          const message = event.message || '';
          const filename = event.filename || '';
          
          // 只拦截确认来自vendor文件的forwardRef相关错误
          if (filename.includes('vendor') && 
              (message.includes('forwardRef') || message.includes('createContext'))) {
            console.warn('🛡️ Vendor error silenced:', message);
            event.preventDefault();
            return false;
          }
        }, true);
        
        console.log('✅ Clean protection setup complete');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🎯 独立的Dialog Portal容器 - 不受#root样式影响 -->
    <div id="dialog-portal-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
