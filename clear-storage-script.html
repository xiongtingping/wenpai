<!DOCTYPE html>
<html>
<head>
    <title>清理localStorage数据</title>
</head>
<body>
    <h1>数据存储清理工具</h1>
    <button onclick="clearAllData()">清理所有localStorage数据</button>
    <button onclick="listAllData()">显示当前数据</button>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');

        function clearAllData() {
            const allKeys = Object.keys(localStorage);
            const removedItems = [];
            
            allKeys.forEach(key => {
                if (key.includes('brand') || key.includes('library') || key.includes('wenpai')) {
                    removedItems.push(key);
                    localStorage.removeItem(key);
                }
            });
            
            output.textContent = `已清理 ${removedItems.length} 个数据项:\n${removedItems.join('\n')}`;
            console.log('清理完成:', removedItems);
        }

        function listAllData() {
            const allKeys = Object.keys(localStorage);
            const relevantKeys = allKeys.filter(key => 
                key.includes('brand') || key.includes('library') || key.includes('wenpai')
            );
            
            output.textContent = `找到 ${relevantKeys.length} 个相关数据项:\n${relevantKeys.join('\n')}`;
        }

        // 自动显示当前数据
        listAllData();
    </script>
</body>
</html>
