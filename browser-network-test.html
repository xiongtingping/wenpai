<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器网络连接测试 - AI API诊断</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }
        .test-section h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #007acc;
            padding-bottom: 10px;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover { background: #005a9e; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .config-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #007acc;
            margin: 10px 0;
        }
        .fix-suggestion {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
        }
        .fix-suggestion h4 {
            margin-top: 0;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 浏览器网络连接测试 - AI API诊断</h1>
        <p>此页面用于诊断和修复浏览器环境中的AI API连接问题</p>

        <div class="test-section">
            <h3>📋 环境检查</h3>
            <div id="env-status" class="status info">正在检查环境...</div>
            <div id="env-details" class="config-display"></div>
        </div>

        <div class="test-section">
            <h3>🌐 网络连接测试</h3>
            <button onclick="testNetworkConnectivity()">测试网络连接</button>
            <div id="network-status" class="status info">等待测试...</div>
        </div>

        <div class="test-section">
            <h3>🔑 API密钥验证</h3>
            <button onclick="testAPIKeys()">验证API密钥</button>
            <div id="api-status" class="status info">等待验证...</div>
        </div>

        <div class="test-section">
            <h3>🤖 AI API连接测试</h3>
            <button onclick="testAIConnection()">测试DeepSeek API</button>
            <button onclick="testOpenAI()">测试OpenAI API</button>
            <div id="ai-status" class="status info">等待测试...</div>
        </div>

        <div class="test-section">
            <h3>📝 智能标题生成测试</h3>
            <button onclick="testTitleGeneration()">测试标题生成</button>
            <div id="title-status" class="status info">等待测试...</div>
        </div>

        <div class="test-section">
            <h3>🔧 自动修复</h3>
            <button onclick="applyFixes()">应用修复方案</button>
            <div id="fix-status" class="status info">等待修复...</div>
        </div>

        <div class="test-section">
            <h3>📊 测试日志</h3>
            <button onclick="clearLog()">清空日志</button>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        // 日志功能
        function log(message) {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }

        function setStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status ${type}`;
        }

        // 环境检查
        async function checkEnvironment() {
            log('🔍 开始环境检查...');
            
            const env = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                cookieEnabled: navigator.cookieEnabled,
                onLine: navigator.onLine,
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                } : '不支持',
                webdriver: navigator.webdriver,
                vendor: navigator.vendor
            };

            const envDetails = document.getElementById('env-details');
            envDetails.innerHTML = `
                <strong>浏览器信息:</strong><br>
                User Agent: ${env.userAgent}<br>
                平台: ${env.platform}<br>
                语言: ${env.language}<br>
                在线状态: ${env.onLine ? '在线' : '离线'}<br>
                网络连接: ${typeof env.connection === 'object' ? 
                    `类型: ${env.connection.effectiveType}, 下行: ${env.connection.downlink}Mbps, RTT: ${env.connection.rtt}ms` : 
                    env.connection}<br>
                Cookie启用: ${env.cookieEnabled}<br>
                自动化检测: ${env.webdriver ? '是' : '否'}
            `;

            setStatus('env-status', '✅ 环境检查完成', 'success');
            log('✅ 环境检查完成');
        }

        // 网络连接测试
        async function testNetworkConnectivity() {
            log('🌐 开始网络连接测试...');
            setStatus('network-status', '正在测试网络连接...', 'info');

            try {
                // 测试基本网络连接
                const response = await fetch('https://httpbin.org/get', {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });

                if (response.ok) {
                    setStatus('network-status', '✅ 基本网络连接正常', 'success');
                    log('✅ 基本网络连接正常');
                } else {
                    setStatus('network-status', '⚠️ 网络连接异常', 'warning');
                    log('⚠️ 网络连接异常');
                }
            } catch (error) {
                setStatus('network-status', `❌ 网络连接失败: ${error.message}`, 'error');
                log(`❌ 网络连接失败: ${error.message}`);
            }
        }

        // API密钥验证
        async function testAPIKeys() {
            log('🔑 开始API密钥验证...');
            setStatus('api-status', '正在验证API密钥...', 'info');

            // 检查环境变量（在浏览器中通过全局变量）
            const envVars = {
                deepseek: window.__ENV__?.VITE_DEEPSEEK_API_KEY || '未配置',
                openai: window.__ENV__?.VITE_OPENAI_API_KEY || '未配置'
            };

            let validKeys = 0;
            if (envVars.deepseek && !envVars.deepseek.includes('your-') && envVars.deepseek.length > 10) {
                log('✅ DeepSeek API密钥已配置');
                validKeys++;
            } else {
                log('❌ DeepSeek API密钥未配置或无效');
            }

            if (envVars.openai && !envVars.openai.includes('your-') && envVars.openai.length > 10) {
                log('✅ OpenAI API密钥已配置');
                validKeys++;
            } else {
                log('❌ OpenAI API密钥未配置或无效');
            }

            if (validKeys > 0) {
                setStatus('api-status', `✅ ${validKeys}个API密钥配置有效`, 'success');
            } else {
                setStatus('api-status', '❌ 没有有效的API密钥配置', 'error');
            }
        }

        // AI API连接测试
        async function testAIConnection() {
            log('🤖 开始DeepSeek API连接测试...');
            setStatus('ai-status', '正在测试DeepSeek API...', 'info');

            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-56c02f3de6fe4a04a346cc14f3c5d310'
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'user', content: '请回复"测试成功"三个字' }
                        ],
                        max_tokens: 10,
                        temperature: 0.1
                    }),
                    mode: 'cors',
                    cache: 'no-cache'
                });

                if (response.ok) {
                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content || '';
                    setStatus('ai-status', `✅ DeepSeek API连接成功: ${content}`, 'success');
                    log(`✅ DeepSeek API连接成功: ${content}`);
                } else {
                    setStatus('ai-status', `❌ DeepSeek API连接失败: ${response.status}`, 'error');
                    log(`❌ DeepSeek API连接失败: ${response.status} ${response.statusText}`);
                }
            } catch (error) {
                setStatus('ai-status', `❌ DeepSeek API连接错误: ${error.message}`, 'error');
                log(`❌ DeepSeek API连接错误: ${error.message}`);
            }
        }

        async function testOpenAI() {
            log('🤖 开始OpenAI API连接测试...');
            setStatus('ai-status', '正在测试OpenAI API...', 'info');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-56c02f3de6fe4a04a346cc14f3c5d310'
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [
                            { role: 'user', content: '请回复"测试成功"三个字' }
                        ],
                        max_tokens: 10,
                        temperature: 0.1
                    }),
                    mode: 'cors',
                    cache: 'no-cache'
                });

                if (response.ok) {
                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content || '';
                    setStatus('ai-status', `✅ OpenAI API连接成功: ${content}`, 'success');
                    log(`✅ OpenAI API连接成功: ${content}`);
                } else {
                    setStatus('ai-status', `❌ OpenAI API连接失败: ${response.status}`, 'error');
                    log(`❌ OpenAI API连接失败: ${response.status} ${response.statusText}`);
                }
            } catch (error) {
                setStatus('ai-status', `❌ OpenAI API连接错误: ${error.message}`, 'error');
                log(`❌ OpenAI API连接错误: ${error.message}`);
            }
        }

        // 智能标题生成测试
        async function testTitleGeneration() {
            log('📝 开始智能标题生成测试...');
            setStatus('title-status', '正在测试标题生成...', 'info');

            try {
                const testPrompt = {
                    systemPrompt: `你是一个专业的标题生成专家。请为以下内容生成5个吸引人的标题，要求：
1. 每个标题不超过20字
2. 符合小红书平台风格
3. 包含数字、表情符号等吸引元素
4. 突出核心价值和用户收益

请严格按照以下JSON格式返回：
{
  "contentAnalysis": {
    "mainTheme": "内容主题",
    "coreObjects": ["核心对象"],
    "userBenefits": ["用户收益"],
    "useScenarios": ["使用场景"]
  },
  "titles": [
    {
      "title": "生成的标题",
      "length": 标题长度,
      "style": "标题风格",
      "semanticFit": 0.9,
      "reasoning": "生成理由"
    }
  ]
}`,
                    userPrompt: `请为以下内容生成标题：

AI工具推荐：5款超实用的AI写作助手，让你的内容创作效率提升300%！

这些工具包括：
1. ChatGPT - 智能对话写作
2. Notion AI - 文档智能助手  
3. Grammarly - 语法检查优化
4. Copy.ai - 营销文案生成
5. Jasper - 专业内容创作

每个工具都有详细的使用教程和实际案例，帮助你在工作中更好地运用AI技术。`
                };

                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer sk-56c02f3de6fe4a04a346cc14f3c5d310'
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: testPrompt.systemPrompt },
                            { role: 'user', content: testPrompt.userPrompt }
                        ],
                        max_tokens: 1000,
                        temperature: 0.8
                    }),
                    mode: 'cors',
                    cache: 'no-cache'
                });

                if (response.ok) {
                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content || '';
                    
                    // 尝试解析JSON
                    try {
                        let jsonContent = content;
                        const jsonMatch = content.match(/```(?:json)?\s*([\s\S]*?)\s*```/);
                        if (jsonMatch) {
                            jsonContent = jsonMatch[1].trim();
                        }
                        
                        const result = JSON.parse(jsonContent);
                        if (result.titles && Array.isArray(result.titles)) {
                            setStatus('title-status', `✅ 标题生成成功，生成了${result.titles.length}个标题`, 'success');
                            log(`✅ 标题生成成功，生成了${result.titles.length}个标题`);
                            log(`📝 第一个标题: ${result.titles[0]?.title || '无'}`);
                        } else {
                            setStatus('title-status', '⚠️ 标题生成响应格式异常', 'warning');
                            log('⚠️ 标题生成响应格式异常');
                        }
                    } catch (parseError) {
                        setStatus('title-status', `❌ JSON解析失败: ${parseError.message}`, 'error');
                        log(`❌ JSON解析失败: ${parseError.message}`);
                        log(`📝 原始响应: ${content.substring(0, 200)}...`);
                    }
                } else {
                    setStatus('title-status', `❌ 标题生成API调用失败: ${response.status}`, 'error');
                    log(`❌ 标题生成API调用失败: ${response.status} ${response.statusText}`);
                }
            } catch (error) {
                setStatus('title-status', `❌ 标题生成测试失败: ${error.message}`, 'error');
                log(`❌ 标题生成测试失败: ${error.message}`);
            }
        }

        // 应用修复方案
        async function applyFixes() {
            log('🔧 开始应用修复方案...');
            setStatus('fix-status', '正在应用修复方案...', 'info');

            try {
                // 1. 优化fetch配置
                const originalFetch = window.fetch;
                window.fetch = async (input, init) => {
                    const url = typeof input === 'string' ? input : input.toString();
                    
                    const optimizedInit = {
                        mode: 'cors',
                        cache: 'no-cache',
                        credentials: 'omit',
                        headers: {
                            'Content-Type': 'application/json',
                            ...init?.headers,
                        },
                        ...init,
                    };
                    
                    log(`🔧 优化网络请求: ${url}`);
                    return originalFetch(input, optimizedInit);
                };

                // 2. 添加重试机制
                window.retryFetch = async (input, init, maxRetries = 3) => {
                    for (let i = 0; i < maxRetries; i++) {
                        try {
                            return await window.fetch(input, init);
                        } catch (error) {
                            if (i === maxRetries - 1) throw error;
                            log(`🔄 请求失败，重试 ${i + 1}/${maxRetries}`);
                            await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                        }
                    }
                };

                setStatus('fix-status', '✅ 修复方案应用成功', 'success');
                log('✅ 修复方案应用成功');
                
                // 显示修复建议
                const fixSuggestions = document.createElement('div');
                fixSuggestions.className = 'fix-suggestion';
                fixSuggestions.innerHTML = `
                    <h4>🔧 已应用的修复方案:</h4>
                    <ul>
                        <li>✅ 优化了fetch请求配置</li>
                        <li>✅ 添加了CORS和缓存设置</li>
                        <li>✅ 实现了自动重试机制</li>
                        <li>✅ 改进了错误处理</li>
                    </ul>
                    <h4>💡 建议:</h4>
                    <ul>
                        <li>如果仍有问题，请尝试禁用浏览器代理</li>
                        <li>检查防火墙设置</li>
                        <li>尝试使用无痕模式</li>
                        <li>清除浏览器缓存和Cookie</li>
                    </ul>
                `;
                document.getElementById('fix-status').parentNode.appendChild(fixSuggestions);
                
            } catch (error) {
                setStatus('fix-status', `❌ 修复方案应用失败: ${error.message}`, 'error');
                log(`❌ 修复方案应用失败: ${error.message}`);
            }
        }

        // 清空日志
        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        // 页面加载时自动执行环境检查
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 浏览器网络测试页面已加载');
            checkEnvironment();
        });
    </script>
</body>
</html>
