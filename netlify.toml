[build]
  # 构建命令
  command = "npm run build"
  # 发布目录
  publish = "dist"
  # 函数目录
  functions = "netlify/functions"

  [build.environment]
    NODE_VERSION = "20"

# 根域名重定向到www子域名
[[redirects]]
  from = "https://wenpai.xyz/*"
  to = "https://www.wenpai.xyz/:splat"
  status = 301
  force = true

# BufPay API 代理路由 - 必须在通用API路由之前
[[redirects]]
  from = "/api/bufpay/pay"
  to = "/.netlify/functions/bufpay-proxy"
  status = 200

[[redirects]]
  from = "/api/bufpay/query/*"
  to = "/.netlify/functions/bufpay-proxy?query=:splat"
  status = 200

# 订单清理任务路由
[[redirects]]
  from = "/api/admin/cleanup-orders"
  to = "/.netlify/functions/order-cleanup"
  status = 200

# 订阅权限系统 API 路由
[[redirects]]
  from = "/api/permissions/verify"
  to = "/.netlify/functions/permissions/verify"
  status = 200

[[redirects]]
  from = "/api/webhooks/payment-callback"
  to = "/.netlify/functions/webhooks/payment-callback"
  status = 200

# API 路由到统一网关函数 api（内部再分发 usage-count 逻辑）
[[redirects]]
  from = "/api/user/usage/*"
  to = "/.netlify/functions/api/user/usage/:splat"
  status = 200

[[redirects]]
  from = "/api/consume-usage"
  to = "/.netlify/functions/api/consume-usage"
  status = 200

# AI代理路由 - 必须在通用API路由之前
# 🔧 FIX: 使用查询参数传递路径，避免 Netlify 路由问题
# 📌 Updated: 2025-10-08 - Use query parameter
[[redirects]]
  from = "/api/ai/:provider/:endpoint*"
  to = "/.netlify/functions/ai-proxy?provider=:provider&path=:endpoint"
  status = 200
  force = true

# 认证相关特殊路由 - 必须在通用API路由之前
[[redirects]]
  from = "/api/auth/cookie"
  to = "/.netlify/functions/auth-cookie"
  status = 200

# 其他 /api/* 走通用网关函数
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Authing回调由前端路由直接处理，避免与函数重定向形成循环
# [[redirects]]
#   from = "/callback"
#   to = "/.netlify/functions/authing-callback"
#   status = 200

# 静态资源处理 - 确保CSS和JS文件不被重定向
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Vite 开发模块 - 在开发环境中优先处理
[[redirects]]
  from = "/@vite/*"
  to = "/@vite/:splat"
  status = 200

[[redirects]]
  from = "/@react-refresh"
  to = "/@react-refresh"
  status = 200

# 静态资源处理 - 确保CSS和JS文件不被重定向
[[redirects]]
  from = "/src/*"
  to = "/src/:splat"
  status = 200

# Vite 依赖模块 - 确保 node_modules 路径不被重定向
[[redirects]]
  from = "/node_modules/*"
  to = "/node_modules/:splat"
  status = 200

# 重定向规则 - 处理React Router的客户端路由
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

