<!DOCTYPE html>
<html lang="zh-CN" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>限时优惠主题测试</title>
    <link rel="stylesheet" href="src/index.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            transition: all 0.3s ease;
        }
        
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 1000;
        }
        
        .theme-btn {
            padding: 8px 12px;
            border: 2px solid hsl(var(--border));
            background: hsl(var(--card));
            color: hsl(var(--foreground));
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .theme-btn:hover {
            background: hsl(var(--accent));
        }
        
        .theme-btn.active {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .test-section {
            margin-bottom: 40px;
            padding: 20px;
            border: 2px solid hsl(var(--border));
            border-radius: 12px;
            background: hsl(var(--card));
        }
        
        .test-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: hsl(var(--foreground));
        }
        
        /* 复制实际的限时优惠样式 */
        .promo-banner {
            background: var(--promo-gradient);
            color: white;
            border: 2px solid var(--promo-border);
            box-shadow: 0 8px 32px hsl(var(--warning) / 0.3), 0 4px 16px hsl(var(--destructive) / 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .promo-banner:hover {
            background: var(--promo-gradient-hover);
            box-shadow: 0 12px 40px hsl(var(--warning) / 0.4), 0 6px 20px hsl(var(--destructive) / 0.3);
            transform: translateY(-2px);
        }

        .promo-countdown {
            background: var(--promo-bg);
            border: 2px solid var(--promo-border);
            color: hsl(var(--foreground));
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px hsl(var(--warning) / 0.2);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }

        .promo-countdown-time {
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 24px;
            display: inline-block;
            margin: 10px 0;
        }
        
        .css-vars {
            font-family: monospace;
            font-size: 12px;
            background: hsl(var(--muted));
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="theme-switcher">
        <button class="theme-btn active" onclick="switchTheme('default')">默认</button>
        <button class="theme-btn" onclick="switchTheme('light')">浅色</button>
        <button class="theme-btn" onclick="switchTheme('beige')">米色</button>
        <button class="theme-btn" onclick="switchTheme('dark')">深色</button>
        <button class="theme-btn" onclick="switchTheme('rainbow')">彩虹</button>
        <button class="theme-btn" onclick="switchTheme('green')">绿色</button>
        <button class="theme-btn" onclick="switchTheme('gold')">金色</button>
    </div>

    <div class="container">
        <h1 class="test-title">🔥 限时优惠主题适配测试</h1>
        
        <div class="test-section">
            <h2 class="test-title">横幅样式 (promo-banner)</h2>
            <div class="promo-banner">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div style="padding: 12px; background: rgba(255,255,255,0.2); border-radius: 50%;">
                            🎁
                        </div>
                        <div>
                            <h3 style="font-size: 24px; font-weight: bold; margin: 0 0 4px 0;">🔥 新用户限时优惠</h3>
                            <p style="margin: 0; opacity: 0.9;">专业版立享74折，高级版立享80折优惠</p>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                            <span>⏰</span>
                            <span style="font-size: 14px;">剩余时间</span>
                        </div>
                        <div class="promo-countdown-time">22:19</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2 class="test-title">倒计时样式 (promo-countdown)</h2>
            <div class="promo-countdown">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 24px;">🔥</span>
                        <div style="font-size: 20px; font-weight: bold;">新用户限时优惠</div>
                        <span style="font-size: 24px;">⏰</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 18px; font-weight: bold;">限时优惠倒计时：</span>
                        <span class="promo-countdown-time">22:19</span>
                    </div>
                    <p style="font-size: 14px; opacity: 0.7; text-align: center; margin: 0;">
                        专业版立享74折，高级版立享80折优惠
                    </p>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2 class="test-title">CSS变量值</h2>
            <div class="css-vars" id="css-vars">
                <!-- CSS变量值将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        function switchTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            
            // 更新按钮状态
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新CSS变量显示
            updateCSSVars();
        }
        
        function updateCSSVars() {
            const computedStyle = getComputedStyle(document.documentElement);
            const vars = [
                '--warning',
                '--destructive', 
                '--primary',
                '--accent',
                '--promo-gradient',
                '--promo-bg',
                '--promo-border'
            ];
            
            const varsDiv = document.getElementById('css-vars');
            varsDiv.innerHTML = vars.map(varName => {
                const value = computedStyle.getPropertyValue(varName).trim();
                return `${varName}: ${value || '未定义'}`;
            }).join('<br>');
        }
        
        // 初始化
        updateCSSVars();
    </script>
</body>
</html>
