<!DOCTYPE html>
<html>
<head>
    <title>安全存储系统测试</title>
    <script src="http://localhost:5174/clear-storage-script.html"></script>
</head>
<body>
    <h1>安全存储系统测试</h1>
    <div>
        <h2>1. 清理旧数据</h2>
        <button onclick="clearOldData()">清理localStorage中的旧数据</button>
        <div id="clearResult"></div>
    </div>
    
    <div>
        <h2>2. 测试新存储</h2>
        <button onclick="testSecureStorage()">测试安全存储系统</button>
        <div id="testResult"></div>
    </div>

    <script type="module">
        // 清理旧的localStorage数据
        function clearOldData() {
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('brand') || key.includes('library') || key.includes('wenpai'))) {
                    keysToRemove.push(key);
                }
            }
            
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            document.getElementById('clearResult').innerHTML = 
                `清理了 ${keysToRemove.length} 个旧数据项:<br>${keysToRemove.join('<br>')}`;
        }

        // 测试安全存储系统
        async function testSecureStorage() {
            try {
                // 这里需要导入安全存储管理器
                const testData = {
                    name: '测试品牌',
                    type: 'test',
                    created: new Date().toISOString()
                };
                
                // 模拟存储测试
                localStorage.setItem('wenpai:user:test:brand:test-item', JSON.stringify(testData));
                const retrieved = JSON.parse(localStorage.getItem('wenpai:user:test:brand:test-item') || '{}');
                
                document.getElementById('testResult').innerHTML = 
                    `✅ 存储测试成功<br>存储数据: ${JSON.stringify(testData)}<br>读取数据: ${JSON.stringify(retrieved)}`;
                    
                // 清理测试数据
                localStorage.removeItem('wenpai:user:test:brand:test-item');
            } catch (error) {
                document.getElementById('testResult').innerHTML = 
                    `❌ 存储测试失败: ${error.message}`;
            }
        }
        
        // 绑定函数到全局
        window.clearOldData = clearOldData;
        window.testSecureStorage = testSecureStorage;
    </script>
</body>
</html>
